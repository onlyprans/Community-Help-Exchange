
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Help | Community Help Exchange</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            background: #fbf8f1;
        }

        .request-wrapper {
            min-height: 85vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 45px 20px;
        }

        .request-card {
            width: 100%;
            max-width: 620px;
            background: white;
            padding: 38px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.07);
        }

        .request-heading {
            text-align: center;
            margin-bottom: 30px;
        }

        .request-heading h1 {
            color: #176b67;
            margin-bottom: 10px;
        }

        .request-heading p {
            color: #71817e;
        }

        .request-card .form-group {
            margin-bottom: 20px;
        }

        .request-card label {
            display: block;
            font-weight: 600;
            color: #344b48;
            margin-bottom: 8px;
        }

        .request-card input,
        .request-card textarea,
        .request-card select {
            width: 100%;
            box-sizing: border-box;
            padding: 13px 14px;
            border: 1px solid #deded8;
            border-radius: 9px;
            background: #fff;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .request-card input:focus,
        .request-card textarea:focus,
        .request-card select:focus {
            border-color: #176b67;
            box-shadow: 0 0 0 3px rgba(23,107,103,0.10);
        }

        .request-card textarea {
            min-height: 120px;
            resize: vertical;
        }

        .request-card button {
            width: 100%;
            margin-top: 10px;
        }

        .request-back {
            text-align: center;
            margin-top: 24px;
        }

        .request-back a {
            color: #176b67;
            text-decoration: none;
            font-weight: 600;
        }

        .request-back a:hover {
            text-decoration: underline;
        }

        #message {
            margin-bottom: 18px;
            text-align: center;
        }

        @media (max-width: 550px) {
            .request-card {
                padding: 26px 20px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">
                Community Help Exchange
            </a>

            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="dashboard.php">Dashboard</a>
                <a href="browse.php">Browse Help</a>
            </div>
        </div>
    </nav>

    <main class="request-wrapper">

        <section class="request-card">

            <div class="request-heading">
                <h1>Request Help</h1>
                <p>
                    Tell the community what you need help with.
                    Someone might be able to make a difference!
                </p>
            </div>

            <div id="message"></div>

            <form id="requestForm">

                <div class="form-group">
                    <label for="title">Request Title</label>
                    <input
                        type="text"
                        id="title"
                        placeholder="Example: Need help with mathematics"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea
                        id="description"
                        placeholder="Explain what you need help with..."
                        required
                    ></textarea>
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" required>
                        <option value="">Select a category</option>
                        <option value="Education">Education</option>
                        <option value="Technology">Technology</option>
                        <option value="Household">Household</option>
                        <option value="Transportation">Transportation</option>
                        <option value="Health">Health</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="location">Location</label>
                    <input
                        type="text"
                        id="location"
                        placeholder="Enter your location"
                    >
                </div>

                <div class="form-group">
                    <label for="preferred_date">Preferred Date</label>
                    <input
                        type="date"
                        id="preferred_date"
                    >
                </div>

                <button
                    type="submit"
                    class="btn btn-primary"
                    id="submitBtn"
                >
                    Submit Help Request
                </button>

            </form>

            <p class="request-back">
                <a href="dashboard.php">← Back to Dashboard</a>
            </p>

        </section>

    </main>

    <footer class="footer">
        <p>Community Help Exchange</p>
        <p>Together, we make helping easier.</p>
    </footer>

    <script>
        document.getElementById("requestForm").addEventListener("submit", async function(event) {

            event.preventDefault();

            const message = document.getElementById("message");
            const submitBtn = document.getElementById("submitBtn");

            const requestData = {
                title: document.getElementById("title").value.trim(),
                description: document.getElementById("description").value.trim(),
                category: document.getElementById("category").value,
                location: document.getElementById("location").value.trim(),
                preferred_date: document.getElementById("preferred_date").value
            };

            submitBtn.disabled = true;
            submitBtn.textContent = "Submitting...";

            try {

                const response = await fetch("api/add_request.php", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    credentials: "same-origin",
                    body: JSON.stringify(requestData)
                });

                const result = await response.json();

                if (result.success) {

                    message.className = "message message-success";
                    message.textContent =
                        result.message + " Redirecting to dashboard...";

                    document.getElementById("requestForm").reset();

                    setTimeout(function() {
                        window.location.href = "dashboard.php";
                    }, 1200);

                } else {

                    message.className = "message message-error";
                    message.textContent =
                        result.message || "Unable to submit your request.";

                    submitBtn.disabled = false;
                    submitBtn.textContent = "Submit Help Request";
                }

            } catch (error) {

                console.error("Request submission error:", error);

                message.className = "message message-error";
                message.textContent =
                    "Unable to connect to the server. Please try again.";

                submitBtn.disabled = false;
                submitBtn.textContent = "Submit Help Request";
            }

        });
    </script>

</body>
</html>
