
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Community Help Exchange</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            display: flex;
            flex-direction: column;
        }

        .auth-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 55px 20px;
        }

        .auth-card {
            width: 100%;
            max-width: 440px;
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 12px 35px rgba(25, 65, 60, 0.09);
            border: 1px solid var(--border);
        }

        .auth-icon {
            width: 58px;
            height: 58px;
            background: #e5f1ee;
            color: var(--primary);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 27px;
            margin: 0 auto 20px;
        }

        .auth-card h1 {
            text-align: center;
            color: var(--primary-dark);
            font-size: 29px;
            margin-bottom: 8px;
        }

        .auth-description {
            text-align: center;
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 30px;
        }

        .auth-card .form-group {
            margin-bottom: 20px;
        }

        .auth-card input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid var(--border);
            border-radius: 9px;
        }

        .auth-card button {
            width: 100%;
            margin-top: 5px;
            padding: 13px;
        }

        .auth-switch {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: var(--muted);
        }

        .auth-switch a {
            color: var(--primary);
            font-weight: bold;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        @media (max-width: 480px) {
            .auth-card {
                padding: 28px 22px;
            }
        }
    </style>
</head>

<body>

<nav class="navbar">
    <div class="container nav-container">
        <a href="index.html" class="logo">Community Help Exchange</a>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="register.html">Register</a>
        </div>
    </div>
</nav>

<main class="auth-wrapper">

    <section class="auth-card">

        <div class="auth-icon">♡</div>

        <h1>Welcome Back!</h1>

        <p class="auth-description">
            Login to connect with your community and make a difference.
        </p>

        <form id="loginForm">

            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit" class="btn btn-primary" id="loginButton">
                Login to Your Account
            </button>

            <p id="message" role="status"></p>

        </form>

        <p class="auth-switch">
            Don't have an account?
            <a href="register.html">Create one here</a>
        </p>

    </section>

</main>

<footer class="footer">
    <p>Community Help Exchange | Building stronger communities together.</p>
</footer>

<script>
const loginForm = document.getElementById("loginForm");
const message = document.getElementById("message");
const loginButton = document.getElementById("loginButton");

loginForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    message.textContent = "Logging in...";
    message.style.color = "var(--muted)";

    loginButton.disabled = true;
    loginButton.textContent = "Logging in...";

    const userData = {
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value
    };

    try {

        const response = await fetch("api/login.php", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            credentials: "same-origin",
            body: JSON.stringify(userData)
        });

        const responseText = await response.text();

        console.log("HTTP Status:", response.status);
        console.log("Server Response:", responseText);

        let result;

        try {
            result = JSON.parse(responseText);
        } catch (parseError) {
            throw new Error("Server returned an invalid response.");
        }

        if (!response.ok || !result.success) {
            message.textContent = result.message || "Login failed.";
            message.style.color = "var(--danger)";
            return;
        }

        message.textContent = "Login successful! Redirecting...";
        message.style.color = "var(--success)";

        window.location.href = "dashboard.php";

    } catch (error) {

        console.error("Login error:", error);

        message.textContent = "Error: " + error.message;
        message.style.color = "var(--danger)";

    } finally {

        loginButton.disabled = false;
        loginButton.textContent = "Login to Your Account";

    }

});
</script>

</body>
</html>
