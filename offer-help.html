
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offer Help | Community Help Exchange</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            background: #fbf8f1;
            min-height: 100vh;
        }

        .offer-wrapper {
            max-width: 620px;
            margin: 55px auto;
            padding: 0 20px;
        }

        .offer-card {
            background: #ffffff;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.07);
        }

        .offer-card h2 {
            text-align: center;
            color: #176b67;
            font-size: 30px;
            margin-bottom: 12px;
        }

        .offer-subtitle {
            text-align: center;
            color: #71817e;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .offer-card .form-group {
            margin-bottom: 20px;
        }

        .offer-card label {
            display: block;
            margin-bottom: 8px;
            color: #294744;
            font-weight: 600;
        }

        .offer-card input,
        .offer-card textarea,
        .offer-card select {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #dce5df;
            border-radius: 9px;
            font-size: 15px;
            font-family: inherit;
            background: #fff;
            box-sizing: border-box;
            outline: none;
        }

        .offer-card textarea {
            min-height: 120px;
            resize: vertical;
        }

        .offer-card input:focus,
        .offer-card textarea:focus,
        .offer-card select:focus {
            border-color: #176b67;
            box-shadow: 0 0 0 3px rgba(23, 107, 103, 0.1);
        }

        .offer-card button {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            border: none;
            border-radius: 9px;
            background: #176b67;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .offer-card button:hover {
            background: #10534f;
        }

        .offer-card button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #176b67;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        #message {
            margin-bottom: 15px;
        }

        @media (max-width: 600px) {
            .offer-card {
                padding: 25px 20px;
            }

            .offer-card h2 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">Community Help Exchange</a>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="dashboard.php">Dashboard</a></li>
                <li><a href="browse.php">Browse Help</a></li>
            </ul>
        </div>
    </nav>

    <main class="offer-wrapper">
        <div class="offer-card">

            <h2>Offer Your Help</h2>

            <p class="offer-subtitle">
                Share your skills and let others know how you can help.
            </p>

            <div id="message"></div>

            <form id="offerForm">

                <div class="form-group">
                    <label for="title">Skill or Service Title</label>
                    <input
                        type="text"
                        id="title"
                        placeholder="Example: Mathematics tutoring"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea
                        id="description"
                        placeholder="Describe what you can offer..."
                        required
                    ></textarea>
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" required>
                        <option value="">Select a category</option>
                        <option value="Education">Education</option>
                        <option value="Technology">Technology</option>
                        <option value="Household">Household</option>
                        <option value="Transportation">Transportation</option>
                        <option value="Health">Health</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="location">Location</label>
                    <input
                        type="text"
                        id="location"
                        placeholder="Enter your location"
                    >
                </div>

                <div class="form-group">
                    <label for="availability">Availability</label>
                    <input
                        type="text"
                        id="availability"
                        placeholder="Example: Weekends, evenings"
                    >
                </div>

                <button type="submit" class="btn btn-primary" id="submitBtn">
                    Submit Help Offer
                </button>

            </form>

            <a href="dashboard.php" class="back-link">
                ← Back to Dashboard
            </a>

        </div>
    </main>

    <footer class="footer">
        <p>Community Help Exchange</p>
    </footer>

    <script>
        document.getElementById("offerForm").addEventListener("submit", async function(event) {

            event.preventDefault();

            const message = document.getElementById("message");
            const submitBtn = document.getElementById("submitBtn");

            const offerData = {
                title: document.getElementById("title").value.trim(),
                description: document.getElementById("description").value.trim(),
                category: document.getElementById("category").value,
                location: document.getElementById("location").value.trim(),
                availability: document.getElementById("availability").value.trim()
            };

            submitBtn.disabled = true;
            submitBtn.textContent = "Submitting...";

            try {

                const response = await fetch("api/add_offer.php", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    credentials: "same-origin",
                    body: JSON.stringify(offerData)
                });

                const result = await response.json();

                if (result.success) {

                    message.className = "message message-success";
                    message.textContent = result.message + " Redirecting to dashboard...";

                    document.getElementById("offerForm").reset();

                    setTimeout(function() {
                        window.location.href = "dashboard.php";
                    }, 1200);

                } else {

                    message.className = "message message-error";
                    message.textContent = result.message;

                    submitBtn.disabled = false;
                    submitBtn.textContent = "Submit Help Offer";
                }

            } catch (error) {

                message.className = "message message-error";
                message.textContent = "Unable to connect to the server.";

                submitBtn.disabled = false;
                submitBtn.textContent = "Submit Help Offer";
            }

        });
    </script>

</body>
</html>
